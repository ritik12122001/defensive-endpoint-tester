name: Scheduled Defensive Endpoint Test (1-Minute Continuous Cloud Worker)

on:
  schedule:
    # Queues continuous workers every 30 minutes to maintain an unbroken 1-minute test stream
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Authorized target URL to test (leave blank to use vars.TARGET_URL)'
        required: false
        type: string
        default: ''
      total_requests:
        description: 'Total number of requests per minute (default: 10)'
        required: false
        type: string
        default: '10'
      max_threads:
        description: 'Concurrent worker threads (default: 2)'
        required: false
        type: string
        default: '2'
      loop_iterations:
        description: 'Total minutes to run continuously in this cloud worker (default: 60 for 1 full hour)'
        required: false
        type: string
        default: '60'
      loop_interval:
        description: 'Exact interval in seconds between test cycles (default: 60s)'
        required: false
        type: string
        default: '60'

concurrency:
  group: continuous-1min-testing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-tests:
    name: Continuous 1-Minute Cloud Testing
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit test suite
        run: |
          echo "Running local regression and unit tests..."
          python -m unittest test_http_client.py

      - name: Validate target configuration
        id: resolve-config
        run: |
          # Priority: Manual workflow_dispatch input > Repository Variable vars.TARGET_URL
          INPUT_URL="${{ inputs.target_url }}"
          VARS_URL="${{ vars.TARGET_URL }}"
          RESOLVED_URL="${INPUT_URL:-$VARS_URL}"

          if [ -z "$RESOLVED_URL" ]; then
            echo "::error::No TARGET_URL configured. Please set the 'TARGET_URL' repository variable in GitHub Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

          echo "target_url=$RESOLVED_URL" >> $GITHUB_OUTPUT

      - name: Execute 1-minute continuous test loop
        env:
          TARGET_URL: ${{ steps.resolve-config.outputs.target_url }}
          TOTAL_REQUESTS: ${{ inputs.total_requests || '10' }}
          MAX_THREADS: ${{ inputs.max_threads || '2' }}
          MAX_RETRIES: '0'
          REQUEST_TIMEOUT: '10.0'
          USER_AGENT: 'DefensiveHttpClient/1.0 (Automated HealthCheck; 1-min continuous worker)'
        run: |
          TOTAL_ITERATIONS=${{ inputs.loop_iterations || '60' }}
          INTERVAL_SECONDS=${{ inputs.loop_interval || '60' }}

          echo "=========================================================="
          echo "STARTING CONTINUOUS 1-MINUTE CLOUD TESTING"
          echo "Target: $TARGET_URL"
          echo "Total Minutes to Run: $TOTAL_ITERATIONS minutes (1 hour)"
          echo "Interval: Every $INTERVAL_SECONDS seconds"
          echo "=========================================================="

          FAILURES=0
          for i in $(seq 1 $TOTAL_ITERATIONS); do
            START_TS=$(date +%s)
            echo ""
            echo "=========================================================="
            echo ">> [Minute $i of $TOTAL_ITERATIONS] Executing at $(date -u '+%Y-%m-%d %H:%M:%S UTC')..."
            echo "=========================================================="

            if python testing_public_domain.py; then
              echo ">> [Minute $i] Successfully executed 10 requests against target."
            else
              echo ">> [Minute $i] Execution reported errors."
              FAILURES=$((FAILURES + 1))
            fi

            if [ "$i" -lt "$TOTAL_ITERATIONS" ]; then
              ELAPSED=$(( $(date +%s) - START_TS ))
              SLEEP_TIME=$(( INTERVAL_SECONDS - ELAPSED ))
              if [ "$SLEEP_TIME" -gt 0 ]; then
                echo ">> [Minute $i] Sleeping ${SLEEP_TIME}s until next minute mark..."
                sleep $SLEEP_TIME
              fi
            fi
          done

          echo ""
          echo "=========================================================="
          echo "Continuous 1-hour block completed ($TOTAL_ITERATIONS minutes)."
          echo "Total cycles executed: $TOTAL_ITERATIONS | Failed cycles: $FAILURES."
          echo "=========================================================="
