name: Scheduled Defensive Endpoint Test (1-Minute Continuous Loop)

on:
  schedule:
    # Triggered every 5 minutes by GitHub scheduler
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Authorized target URL to test (leave blank to use vars.TARGET_URL)'
        required: false
        type: string
        default: ''
      total_requests:
        description: 'Total number of requests per cycle (max 10 for safe initial validation)'
        required: false
        type: string
        default: '10'
      max_threads:
        description: 'Concurrent worker threads (max 2 for safe bounded concurrency)'
        required: false
        type: string
        default: '2'
      loop_iterations:
        description: 'Number of 1-minute test cycles per runner execution (default: 5)'
        required: false
        type: string
        default: '5'
      loop_interval:
        description: 'Delay in seconds between test cycles (default: 60s for 1-minute checks)'
        required: false
        type: string
        default: '60'

concurrency:
  group: scheduled-testing-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-tests:
    name: Execute 1-Minute Continuous Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit test suite
        run: |
          echo "Running local regression and unit tests..."
          python -m unittest test_http_client.py

      - name: Validate target configuration
        id: resolve-config
        run: |
          # Priority: Manual workflow_dispatch input > Repository Variable vars.TARGET_URL
          INPUT_URL="${{ inputs.target_url }}"
          VARS_URL="${{ vars.TARGET_URL }}"
          RESOLVED_URL="${INPUT_URL:-$VARS_URL}"

          if [ -z "$RESOLVED_URL" ]; then
            echo "::error::No TARGET_URL configured. Please set the 'TARGET_URL' repository variable in GitHub Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

          echo "target_url=$RESOLVED_URL" >> $GITHUB_OUTPUT

      - name: Execute 1-minute continuous test loop
        env:
          TARGET_URL: ${{ steps.resolve-config.outputs.target_url }}
          TOTAL_REQUESTS: ${{ inputs.total_requests || '10' }}
          MAX_THREADS: ${{ inputs.max_threads || '2' }}
          MAX_RETRIES: '0'
          REQUEST_TIMEOUT: '10.0'
          USER_AGENT: 'DefensiveHttpClient/1.0 (Automated HealthCheck; 1-min continuous loop)'
        run: |
          TOTAL_ITERATIONS=${{ inputs.loop_iterations || '5' }}
          INTERVAL_SECONDS=${{ inputs.loop_interval || '60' }}

          echo "Starting 1-minute continuous test loop: $TOTAL_ITERATIONS cycles, ${INTERVAL_SECONDS}s between cycles..."

          FAILURES=0
          for i in $(seq 1 $TOTAL_ITERATIONS); do
            echo ""
            echo "=========================================================="
            echo ">> [Cycle $i of $TOTAL_ITERATIONS] Executing at $(date -u '+%Y-%m-%d %H:%M:%S UTC')..."
            echo "=========================================================="

            if python testing_public_domain.py; then
              echo ">> [Cycle $i] Test completed successfully."
            else
              echo ">> [Cycle $i] Test finished with errors."
              FAILURES=$((FAILURES + 1))
            fi

            if [ "$i" -lt "$TOTAL_ITERATIONS" ]; then
              echo ">> Waiting ${INTERVAL_SECONDS}s until next check..."
              sleep $INTERVAL_SECONDS
            fi
          done

          echo ""
          echo "=========================================================="
          echo "All $TOTAL_ITERATIONS cycles completed. Failed cycles: $FAILURES."
          echo "=========================================================="

          if [ "$FAILURES" -gt 0 ]; then
            echo "::error::One or more test iterations failed."
            exit 1
          fi
