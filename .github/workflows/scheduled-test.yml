name: Scheduled Defensive Endpoint Test (1-Minute Continuous Runner)

on:
  schedule:
    # Trigger every 5 minutes (GitHub Actions minimum schedule interval)
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to test (default: https://tracker.bepcssa.in)'
        required: false
        type: string
        default: 'https://tracker.bepcssa.in'
      total_requests:
        description: 'Total number of requests per minute (default: 10)'
        required: false
        type: string
        default: '10'
      max_threads:
        description: 'Concurrent worker threads (default: 2)'
        required: false
        type: string
        default: '2'
      loop_iterations:
        description: 'Total minutes to run continuously in this cloud worker (default: 5)'
        required: false
        type: string
        default: '5'
      loop_interval:
        description: 'Exact interval in seconds between test cycles (default: 60s)'
        required: false
        type: string
        default: '60'

concurrency:
  group: continuous-1min-testing
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-tests:
    name: Continuous 1-Minute Cloud Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate target configuration
        id: resolve-config
        run: |
          # Priority: Manual input > Repo Variable > Default URL
          INPUT_URL="${{ inputs.target_url }}"
          VARS_URL="${{ vars.TARGET_URL }}"
          RESOLVED_URL="${INPUT_URL:-${VARS_URL:-https://tracker.bepcssa.in}}"

          echo "Target URL resolved to: $RESOLVED_URL"
          echo "target_url=$RESOLVED_URL" >> $GITHUB_OUTPUT

      - name: Verify single execution smoke test
        env:
          TARGET_URL: ${{ steps.resolve-config.outputs.target_url }}
          RUN_ONCE: 'true'
          TOTAL_REQUESTS: '2'
          MAX_THREADS: '2'
          PROGRESS_INTERVAL: '1'
        run: |
          echo "Running initial smoke test..."
          python testing_public_domain.py

      - name: Execute 1-minute continuous test loop
        env:
          TARGET_URL: ${{ steps.resolve-config.outputs.target_url }}
          TOTAL_REQUESTS: ${{ inputs.total_requests || '10' }}
          MAX_THREADS: ${{ inputs.max_threads || '2' }}
          REQUEST_TIMEOUT: '10'
          USER_AGENT: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36'
        run: |
          TOTAL_ITERATIONS=${{ inputs.loop_iterations || '5' }}
          INTERVAL_SECONDS=${{ inputs.loop_interval || '60' }}

          echo "=========================================================="
          echo "STARTING CONTINUOUS 1-MINUTE CLOUD TESTING"
          echo "Target: $TARGET_URL"
          echo "Cycles in this worker: $TOTAL_ITERATIONS (1 per minute)"
          echo "Interval: Every $INTERVAL_SECONDS seconds"
          echo "=========================================================="

          for i in $(seq 1 $TOTAL_ITERATIONS); do
            START_TS=$(date +%s)
            echo ""
            echo "=========================================================="
            echo ">> [Minute $i of $TOTAL_ITERATIONS] Executing at $(date -u '+%Y-%m-%d %H:%M:%S UTC')..."
            echo "=========================================================="

            RUN_ONCE=true python testing_public_domain.py

            if [ "$i" -lt "$TOTAL_ITERATIONS" ]; then
              ELAPSED=$(( $(date +%s) - START_TS ))
              SLEEP_TIME=$(( INTERVAL_SECONDS - ELAPSED ))
              if [ "$SLEEP_TIME" -gt 0 ]; then
                echo ">> [Minute $i] Sleeping ${SLEEP_TIME}s until next minute mark..."
                sleep $SLEEP_TIME
              fi
            fi
          done

          echo ""
          echo "=========================================================="
          echo "Worker completed $TOTAL_ITERATIONS cycles successfully."
          echo "=========================================================="
